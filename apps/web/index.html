<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F9FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1B24" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Séne Wérr — Votre santé connectée et centralisée au Sénégal" />
    <title>Séne Wérr</title>
    <script>
      // Applique le thème avant le premier rendu (anti-flash)
      (function () {
        try {
          var saved = localStorage.getItem('medikool-theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.classList.add(saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
